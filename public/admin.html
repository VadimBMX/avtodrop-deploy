<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b0f16">
  <meta name="robots" content="noindex">
  <title>АВТОДРОП · Адмінка</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23ffc400'/><path d='M9 23 15 9h2l6 14h-3.4l-1.3-3.3h-4.6L12.4 23Zm5.6-6.1h2.8L16 13.2Z' fill='%231a1300'/></svg>">
  <!-- installable on a computer (Chrome / Edge «Встановити»): the manifest and admin-sw.js, scoped to this page -->
  <link rel="manifest" href="admin.webmanifest">
  <link rel="apple-touch-icon" href="admin-icon-192.png">
  <meta name="apple-mobile-web-app-title" content="АВТОДРОП Адмін">
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="admin.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <!-- phone: a top bar (menu + section name, player search); the side bar below turns into a drawer (admin.css «phone») -->
  <header class="topbar">
    <button class="menu-btn" data-act="navOpen" aria-controls="side" aria-expanded="false" aria-label="Розділи адмінки"><svg class="i"><use href="icons.svg#i-menu-2"/></svg><span id="tbTitle">Адмінка</span><span class="badge red" id="supN2" hidden></span></button>
    <form class="qsearch" role="search" hidden>
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" stroke-width="2"/><path d="m15.5 15.5 5 5" stroke-width="2" stroke-linecap="round"/></svg>
      <input type="search" placeholder="Гравець: ID, @нік" autocomplete="off" enterkeyhint="search" aria-label="Знайти гравця">
    </form>
  </header>
  <div class="scrim" data-act="navClose" hidden></div>
  <div class="shell">
    <aside class="side" id="side">
      <div class="brand"><span class="logo">A</span><div><b>АВТОДРОП</b><small>адмін-панель</small></div><button class="drawer-x" data-act="navClose" aria-label="Закрити меню"><svg class="i"><use href="icons.svg#i-x"/></svg></button></div>
      <form id="qsearch" class="qsearch" role="search" hidden>
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" stroke-width="2"/><path d="m15.5 15.5 5 5" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="qs" type="search" placeholder="ID, @username, ім’я" autocomplete="off" enterkeyhint="search" aria-label="Знайти гравця">
      </form>
      <nav id="nav">
        <button data-go="live"><svg class="i"><use href="icons.svg#i-activity"/></svg>Живий дашборд</button>
        <button data-go="overview"><svg class="i"><use href="icons.svg#i-gauge"/></svg>Огляд</button>
        <button data-go="economy" data-admin-only><svg class="i"><use href="icons.svg#i-chart-bar"/></svg>Економіка й кейси</button>
        <button data-go="metrics" data-admin-only><svg class="i"><use href="icons.svg#i-target-arrow"/></svg>Метрики</button>
        <button data-go="users"><svg class="i"><use href="icons.svg#i-users"/></svg>Гравці</button>
        <button data-go="support"><svg class="i"><use href="icons.svg#i-info-circle"/></svg>Підтримка <span class="badge red" id="supN" hidden></span></button>
        <button data-go="bugs"><svg class="i"><use href="icons.svg#i-bug"/></svg>Знайдені баги</button>
        <button data-go="broadcast" data-admin-only><svg class="i"><use href="icons.svg#i-bell"/></svg>Розсилка</button>
        <button data-go="log"><svg class="i"><use href="icons.svg#i-shield-check"/></svg>Журнал дій</button>
        <button data-go="search"><svg class="i"><use href="icons.svg#i-license"/></svg>Номери і авто</button>
        <button data-go="market"><svg class="i"><use href="icons.svg#i-building-store"/></svg>Ринок</button>
        <button data-go="dayrace"><svg class="i"><use href="icons.svg#i-flag-3"/></svg>Заїзд дня</button>
        <button data-go="containers"><svg class="i"><use href="icons.svg#i-box"/></svg>Причал</button>
        <button data-go="events"><svg class="i"><use href="icons.svg#i-calendar"/></svg>Події</button>
        <button data-go="halloween"><svg class="i"><use href="icons.svg#i-ghost"/></svg>Хелловін</button>
        <button data-go="channel" data-admin-only><svg class="i"><use href="icons.svg#i-share"/></svg>Канал</button>
        <button data-go="clubs"><svg class="i"><use href="icons.svg#i-users"/></svg>Автоклуби</button>
        <button data-go="referrals"><svg class="i"><use href="icons.svg#i-share"/></svg>Реферали</button>
        <button data-go="payments" data-admin-only><svg class="i"><use href="icons.svg#i-star"/></svg>Платежі</button>
        <button data-go="promos" data-admin-only><svg class="i"><use href="icons.svg#i-ticket"/></svg>Промокоди</button>
        <button data-go="db" data-admin-only><svg class="i"><use href="icons.svg#i-database"/></svg>Перегляд бази</button>
        <button data-go="settings" data-admin-only><svg class="i"><use href="icons.svg#i-settings"/></svg>Налаштування гри</button>
      </nav>
      <button class="back install" id="installBtn" hidden><svg class="i"><use href="icons.svg#i-device-desktop"/></svg><span>Встановити як програму</span></button>
      <button class="back" data-act="backToGame"><svg class="i"><use href="icons.svg#i-chevron-left"/></svg><span>Назад у гру</span></button>
      <div class="side-foot" id="who"></div>
    </aside>
    <main id="main"><div class="empty">Завантаження…</div></main>
  </div>
  <div id="modal" class="modal" hidden><div class="dialog" id="dialog" role="dialog" aria-modal="true"></div></div>
  <div id="toast" class="toast" hidden role="status"></div>
  <script type="module" src="admin.js"></script>
</body>
</html>
